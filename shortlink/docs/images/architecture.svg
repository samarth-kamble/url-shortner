<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 24px; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
      .box { rx: 10px; stroke-width: 2px; }
      .box-user { fill: #1e293b; stroke: #38bdf8; }
      .box-lb { fill: #1e293b; stroke: #818cf8; }
      .box-app { fill: #1e293b; stroke: #34d399; }
      .box-cache { fill: #1e293b; stroke: #fbbf24; }
      .box-db { fill: #1e293b; stroke: #60a5fa; }
      .box-kafka { fill: #1e293b; stroke: #f43f5e; }
      .box-analytics { fill: #1e293b; stroke: #c084fc; }
      .group-box { fill: #1e293b; fill-opacity: 0.4; stroke-width: 1.5px; stroke-dasharray: 6 4; rx: 12px; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #f1f5f9; text-anchor: middle; }
      .node-subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .edge { stroke: #64748b; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
      .edge-dashed { stroke: #94a3b8; stroke-width: 2px; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-dashed); }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" class="bg" rx="16" />

  <!-- Title -->
  <text x="50" y="50" class="title">ShortLink - System Architecture</text>
  <text x="50" y="75" class="subtitle">Distributed URL Shortener &amp; Real-Time Async Click Analytics</text>

  <!-- User / Client -->
  <g filter="url(#shadow)">
    <rect x="390" y="105" width="220" height="50" class="box box-user" />
    <text x="500" y="132" class="node-text">User / Client</text>
    <text x="500" y="147" class="node-subtext">Web Browser / API Client</text>
  </g>

  <!-- Connection User -> Nginx -->
  <path d="M 500 155 L 500 195" class="edge" />
  <text x="555" y="180" class="edge-label">HTTP Request</text>

  <!-- Nginx Load Balancer -->
  <g filter="url(#shadow)">
    <rect x="390" y="195" width="220" height="50" class="box box-lb" />
    <text x="500" y="222" class="node-text">Nginx Load Balancer</text>
    <text x="500" y="237" class="node-subtext">Reverse Proxy / SSL / Rate Limit</text>
  </g>

  <!-- Connections Nginx -> App Nodes -->
  <path d="M 440 245 L 350 295" class="edge" />
  <path d="M 560 245 L 650 295" class="edge" />

  <!-- Subgraph: ShortLink Modular Monolith -->
  <rect x="50" y="275" width="900" height="235" class="group-box" stroke="#34d399" />
  <text x="75" y="302" class="group-title" fill="#34d399">ShortLink Modular Monolith</text>

  <!-- App Node 1 -->
  <g filter="url(#shadow)">
    <rect x="240" y="300" width="210" height="55" class="box box-app" />
    <text x="345" y="327" class="node-text">ShortLink API (Node 1)</text>
    <text x="345" y="344" class="node-subtext">Spring Boot 4.x / Java 25</text>
  </g>

  <!-- App Node 2 -->
  <g filter="url(#shadow)">
    <rect x="550" y="300" width="210" height="55" class="box box-app" />
    <text x="655" y="327" class="node-text">ShortLink API (Node 2)</text>
    <text x="655" y="344" class="node-subtext">Spring Boot 4.x / Java 25</text>
  </g>

  <!-- Internal Caching & Shard Router -->
  <g filter="url(#shadow)">
    <rect x="90" y="420" width="190" height="50" class="box box-cache" />
    <text x="185" y="445" class="node-text">L1: Caffeine Cache</text>
    <text x="185" y="460" class="node-subtext">In-Memory Hot Keys (&lt;1ms)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="320" y="420" width="190" height="50" class="box box-cache" />
    <text x="415" y="445" class="node-text">L2: Redis Cache</text>
    <text x="415" y="460" class="node-subtext">Distributed Cache-Aside</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="550" y="420" width="200" height="50" class="box box-app" />
    <text x="650" y="445" class="node-text">Consistent Hash Router</text>
    <text x="650" y="460" class="node-subtext">Virtual Nodes Ring</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="420" width="150" height="50" class="box box-kafka" />
    <text x="855" y="445" class="node-text">Click Producer</text>
    <text x="855" y="460" class="node-subtext">Async Kafka Publisher</text>
  </g>

  <!-- Monolith internal links -->
  <path d="M 300 355 L 210 420" class="edge" />
  <path d="M 280 445 L 320 445" class="edge-dashed" />
  <text x="300" y="440" class="edge-label">Miss</text>

  <path d="M 510 445 L 550 445" class="edge-dashed" />
  <text x="530" y="440" class="edge-label">Miss</text>

  <path d="M 670 355 L 650 420" class="edge" />
  <path d="M 720 355 L 820 420" class="edge" />
  <text x="785" y="380" class="edge-label">Click Event</text>

  <!-- Database Tier -->
  <rect x="50" y="555" width="560" height="195" class="group-box" stroke="#60a5fa" />
  <text x="75" y="582" class="group-title" fill="#60a5fa">Database Tier (PostgreSQL Sharded)</text>

  <g filter="url(#shadow)">
    <rect x="75" y="605" width="150" height="120" class="box box-db" />
    <text x="150" y="650" class="node-text">PostgreSQL</text>
    <text x="150" y="670" class="node-text">Shard 1</text>
    <text x="150" y="695" class="node-subtext">Range: Hash[0..N]</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="255" y="605" width="150" height="120" class="box box-db" />
    <text x="330" y="650" class="node-text">PostgreSQL</text>
    <text x="330" y="670" class="node-text">Shard 2</text>
    <text x="330" y="695" class="node-subtext">Range: Hash[N..M]</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="605" width="150" height="120" class="box box-db" />
    <text x="510" y="650" class="node-text">PostgreSQL</text>
    <text x="510" y="670" class="node-text">Shard 3</text>
    <text x="510" y="695" class="node-subtext">Range: Hash[M..MAX]</text>
  </g>

  <!-- Shard Router to DBs -->
  <path d="M 600 470 L 225 605" class="edge" />
  <path d="M 640 470 L 330 605" class="edge" />
  <path d="M 680 470 L 480 605" class="edge" />

  <!-- Kafka & Analytics Tier -->
  <rect x="640" y="555" width="310" height="195" class="group-box" stroke="#c084fc" />
  <text x="665" y="582" class="group-title" fill="#c084fc">Analytics Tier (Async)</text>

  <g filter="url(#shadow)">
    <rect x="670" y="605" width="250" height="45" class="box box-kafka" />
    <text x="795" y="628" class="node-text">Kafka Topic: link-clicks</text>
    <text x="795" y="643" class="node-subtext">Partitioned Click Stream</text>
  </g>

  <path d="M 855 470 L 800 605" class="edge" />

  <g filter="url(#shadow)">
    <rect x="670" y="675" width="250" height="55" class="box box-analytics" />
    <text x="795" y="700" class="node-text">Analytics Consumer App</text>
    <text x="795" y="718" class="node-subtext">Idempotent Aggregate Store</text>
  </g>

  <path d="M 795 650 L 795 675" class="edge" />

</svg>


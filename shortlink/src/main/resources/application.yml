spring:
  application:
    name: shortlink
  datasource:
    url: jdbc:postgresql://localhost:5432/shortlink
    username: shortlink
    password: shortlink
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: ShortLinkHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

shortlink:
  base-url: http://localhost:8080


spring:
  application:
    name: shortlink
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/shortlink
    username: shortlink
    password: shortlink
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: ShortLinkHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
      retries: 2
      batch-size: 32768
      compression-type: lz4
      properties:
        linger.ms: 10
        max.block.ms: 500

server:
  tomcat:
    max-connections: 10000
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

shortlink:
  base-url: http://localhost:8080
  node-id: ${SHORTLINK_NODE_ID:1}
  custom-epoch: 1767225600000 # 2026-01-01T00:00:00Z UTC
  cache:
    l1-max-size: 10000
    l1-ttl-minutes: 10
    l2-ttl-hours: 24
    negative-ttl-seconds: 60
  rate-limit:
    enabled: ${SHORTLINK_RATE_LIMIT_ENABLED:true}
    write:
      capacity: 20
      refill-tokens-per-second: 0.5
    read:
      capacity: 1000
      refill-tokens-per-second: 500.0
  analytics:
    kafka-enabled: ${SHORTLINK_ANALYTICS_KAFKA_ENABLED:true}
    clicks-topic: shortlink.clicks

